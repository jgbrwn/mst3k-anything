<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>mst3k-anything — riff any video</title>
<style>
  :root {
    --bg:#0d0d12; --panel:#17171f; --panel2:#111118; --line:#292936; --ink:#e8e6df;
    --dim:#9a97ad; --amber:#ffb454; --red:#c0392b; --green:#2ecc71; --blue:#8eb8ff;
  }
  * { box-sizing:border-box }
  body { margin:0; background:radial-gradient(ellipse at 50% -20%,#20202d 0,var(--bg) 52%);
    color:var(--ink); font:15px/1.5 "Segoe UI",system-ui,sans-serif; min-height:100vh }
  .wrap { max-width:900px; margin:0 auto; padding:2rem 1.25rem 4rem }
  .curtain { height:7px; background:repeating-linear-gradient(90deg,var(--red) 0 28px,#8e2b20 28px 56px);
    border-radius:3px; opacity:.8; box-shadow:0 0 24px #c0392b33 }
  h1 { font-family:Georgia,serif; letter-spacing:.03em; margin:.65em 0 .1em; font-size:2.1rem }
  .tag { color:var(--dim); margin:0 0 1.5rem }
  form { display:grid; grid-template-columns:minmax(0,1fr) 170px 170px 130px auto; gap:.6rem; margin-bottom:1.4rem }
  input, select { padding:.68rem .8rem; background:var(--panel); border:1px solid var(--line);
    border-radius:8px; color:var(--ink); font-size:.95rem; min-width:0 }
  input:focus, select:focus, textarea:focus { outline:2px solid #ffb45455; border-color:var(--amber) }
  button { padding:.68rem 1.1rem; background:var(--amber); color:#1a1208; border:0; border-radius:8px;
    font-weight:700; cursor:pointer; white-space:nowrap }
  button:disabled { opacity:.45; cursor:default }
  .picker-note { color:var(--dim); font-size:.8rem; margin:-.9rem 0 1.4rem; min-height:1.2em }
  .model-wrap { display:none; grid-column:2 / 3; margin-top:-.25rem }
  .model-wrap.show { display:block }
  .model-wrap input { width:100% }
  .card { background:linear-gradient(145deg,var(--panel),#14141c); border:1px solid var(--line);
    border-radius:12px; padding:1.1rem 1.2rem; margin-bottom:1rem; box-shadow:0 8px 30px #0002 }
  .detail-head, .row-head { display:flex; justify-content:space-between; align-items:flex-start; gap:1rem }
  .title { font-weight:700; font-size:1rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  .src { color:var(--dim); font-size:.82rem; word-break:break-all }
  .meta { color:var(--dim); font-size:.78rem; margin-top:.15rem }
  .status { display:inline-block; padding:.13em .65em; border-radius:20px; font-size:.72rem; font-weight:700;
    text-transform:uppercase; letter-spacing:.06em; flex:none }
  .st-queued { background:#2a2a36; color:#c6c3d0 }
  .st-running { background:#3a2f18; color:var(--amber) }
  .st-done { background:#1c2b1f; color:var(--green) }
  .st-failed { background:#3a1d18; color:#e07b6a }
  .stage { margin-top:.65rem; color:var(--amber); font-family:ui-monospace,monospace; font-size:.84rem; min-height:1.2em }
  .progress-wrap { margin:.5rem 0 0 }
  .pbar { width:100%; height:6px; background:#2a2a35; border-radius:3px; overflow:hidden }
  .pfill { height:100%; background:#e8b24a; transition:width .4s }
  .ptext { font-size:.72rem; color:#888; margin-top:.25rem }
  .log { margin:.7rem 0 0; padding:.7rem; max-height:180px; overflow:auto; white-space:pre-wrap; color:#a8a5b5;
    background:var(--panel2); border:1px solid #20202b; border-radius:7px; font:12px/1.45 ui-monospace,SFMono-Regular,monospace }
  video { width:100%; margin-top:.8rem; border-radius:8px; display:block; background:#000 }
  a.dl { color:var(--amber); font-size:.86rem; margin-right:1rem }
  .err { color:#e07b6a; font-size:.8rem; white-space:pre-wrap; max-height:180px; overflow:auto; margin-top:.7rem }
  textarea { width:100%; height:155px; background:#0a0a0e; color:var(--ink); border:1px solid var(--line); border-radius:8px;
    padding:.6rem; font-family:ui-monospace,monospace; font-size:.82rem; margin:.6rem 0 .45rem; resize:vertical }
  .btn2 { background:#2a2a36; color:var(--ink); padding:.45rem .8rem; border-radius:6px; border:1px solid var(--line); cursor:pointer; font-size:.83rem }
  .btn-danger { color:#e07b6a; background:#291b1d }
  .compare { position:relative; width:100%; margin:.8rem 0; user-select:none }
  .compare video { display:block; width:100%; border-radius:8px }
  .compare .after { position:absolute; inset:0; overflow:hidden }
  .compare .after video { position:absolute; top:0; height:100%; width:100%; clip-path:inset(0 0 0 50%); border-radius:0 }
  .compare .handle { position:absolute; top:0; left:50%; width:3px; height:100%; background:var(--amber); cursor:ew-resize; z-index:5 }
  .compare .handle::after { content:'⇆'; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:var(--amber);
    color:#1a1208; border-radius:50%; width:28px; height:28px; display:flex; align-items:center; justify-content:center; font-size:.9rem }
  .hint { color:var(--dim); font-size:.82rem }
  .hist h2 { font-family:Georgia,serif; font-size:1.15rem; color:var(--dim); margin:1.7rem 0 .55rem }
  .row { padding:.75rem .2rem; border-bottom:1px solid var(--line) }
  .row-actions { display:flex; align-items:center; gap:.45rem; flex:none }
  .empty { color:var(--dim); border:1px dashed var(--line); border-radius:10px; padding:1.25rem; text-align:center }
  .writer-line { grid-column:1 / -1; display:flex; align-items:center; gap:1rem; flex-wrap:wrap; color:var(--dim); font-size:.78rem; margin:-.15rem 0 -.05rem; }
  .writer-line span { white-space:nowrap; }
  .writer-line b { color:var(--ink); font-weight:700; }
  .writer-line .jmodel, .writer-line .jbase { color:#8fd0c8; }
  #submitBtn { grid-column:1 / -1; }
  @media (max-width:700px) {
    form { grid-template-columns:1fr 1fr }
    form input[type=url] { grid-column:1 / -1 }
    form button { grid-column:1 / -1 }
    form select:nth-of-type(3) { grid-column:1 / 3 }  /* density picker spans both cols on narrow */
    .model-wrap { grid-column:1 / -1; margin-top:-.2rem }
    .detail-head, .row-head { align-items:flex-start; flex-direction:column; gap:.55rem }
    .row-actions { width:100%; justify-content:flex-start }
  }

.player-overlay { position:fixed; inset:0; background:rgba(0,0,0,.95); z-index:60;
  display:flex; align-items:center; justify-content:center }
.player-overlay video { max-width:96vw; max-height:92vh }
.player-close { position:absolute; top:.5rem; right:.5rem; font-size:2rem; color:#fff;
  background:none; border:none; cursor:pointer }
@media (max-width:520px) { .player-overlay video { max-width:100vw; max-height:88vh } }
</style>
</head>
<body>
<div class="wrap">
  <div class="curtain"></div>
  <h1>mst3k-anything</h1>
  <p class="tag">Paste any video URL (YouTube, archive.org, direct link). Get back robot heckling, perfectly timed.</p>
  <form id="f">
    <input id="src" type="url" required placeholder="https://youtube.com/watch?v=…" aria-label="Video URL">
    <select id="provider" aria-label="LLM provider"></select>
    <select id="judgeProvider" aria-label="Judge LLM provider">
      <option value="">Judge = same as writer</option>
    </select>
    <select id="riffDensity" aria-label="Riff density" title="How many riffs to write. The default picks a count based on video length + content type. Lower = sparser (trust the movie more), Higher = denser (more heckling).">
      <option value="0">Extra sparse</option>
      <option value="1">Sparse</option>
      <option value="2" selected>Default</option>
      <option value="3">Dense</option>
      <option value="4">Extra dense</option>
    </select>
    <div class="writer-line" id="writerLine" title="These are the models that will be used for this submission.">
      <span>Writer: <b id="writerModelLine">—</b> · <b id="writerBaseLine">—</b></span>
      <span>Judge: <b id="judgeModelLine">—</b> · <b id="judgeBaseLine">—</b></span>
    </div>
    <button id="submitBtn" type="submit">🎬 Riff it</button>
    <div id="modelWrap" class="model-wrap">
      <input id="orModel" list="orModels" placeholder="OpenRouter model (provider/model)" aria-label="OpenRouter model">
      <datalist id="orModels"></datalist>
    </div>
    <div id="judgeModelWrap" class="model-wrap">
      <input id="orJudgeModel" list="orJudgeModels" placeholder="OpenRouter judge model (provider/model)" aria-label="OpenRouter judge model">
      <datalist id="orJudgeModels"></datalist>
    </div>
  </form>
  <div id="pickerNote" class="picker-note"></div>
  <div id="active"></div>
  <div class="hist"><h2>History</h2><div id="list"></div></div>
</div>
<script>


function playPositionKey(id){ return `mst3k-anything.playhead.${id}`; }
function savePlayPosition(id,video){
  if(!id || !video || !Number.isFinite(video.currentTime) || video.ended) return;
  let existing=0;
  try { existing=Number(localStorage.getItem(playPositionKey(id)) || 0); } catch(_){ }
  // Do not replace a saved resume point with the initial 0s pause that can
  // fire before media metadata/seek restoration finishes.
  if(video.currentTime < .25 && existing > .5 && video.dataset.resumeTarget) return;
  try { localStorage.setItem(playPositionKey(id), String(video.currentTime)); } catch(_){ }
}
function playVideo(id){
  closePlayer();
  const div=document.createElement('div');
  div.className='player-overlay'; div.id='playerOverlay';
  div.innerHTML=`<button class="player-close" onclick="closePlayer()">×</button>
    <video controls autoplay playsinline src="/api/jobs/${id}/video"></video>`;
  const video=div.querySelector('video');
  video.dataset.jobId=String(id);
  let saved=0;
  try { saved=Number(localStorage.getItem(playPositionKey(id)) || 0); } catch(_){ }
  if(saved>0) video.dataset.resumeTarget=String(saved);
  video.addEventListener('loadedmetadata',()=>{
    if(saved>0 && saved < video.duration-0.5){
      try { video.currentTime=saved; } catch(_){ }
    } else if(saved >= video.duration-0.5){
      try { localStorage.removeItem(playPositionKey(id)); } catch(_){ }
      delete video.dataset.resumeTarget;
    }
    video.play().catch(()=>{});
  });
  video.addEventListener('timeupdate',()=>{
    if(video.currentTime>.25) delete video.dataset.resumeTarget;
    savePlayPosition(id,video);
  });
  video.addEventListener('pause',()=>savePlayPosition(id,video));
  video.addEventListener('ended',()=>{ try { localStorage.removeItem(playPositionKey(id)); } catch(_){ } });
  document.body.appendChild(div);
}
function closePlayer(){
  const p=document.getElementById('playerOverlay');
  if(p){ const video=p.querySelector('video'); if(video) savePlayPosition(video.dataset.jobId,video); p.querySelector('video')?.pause(); p.remove(); }
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closePlayer(); });
const listEl = document.getElementById('list');
const activeEl = document.getElementById('active');
const providerEl = document.getElementById('provider');
const judgeProviderEl = document.getElementById('judgeProvider');
const modelWrap = document.getElementById('modelWrap');
const judgeModelWrap = document.getElementById('judgeModelWrap');
const orModelEl = document.getElementById('orModel');
const orJudgeModelEl = document.getElementById('orJudgeModel');
const pickerNote = document.getElementById('pickerNote');
const writerModelLine = document.getElementById('writerModelLine');
const writerBaseLine = document.getElementById('writerBaseLine');
const judgeModelLine = document.getElementById('judgeModelLine');
const judgeBaseLine = document.getElementById('judgeBaseLine');
let providers = [], jobs = [], activeId = null, trackToken = 0, orLoaded = false;
let logScrollTimer = null, logUserScrolling = false, logProgrammatic = false;

function esc(s){ const d=document.createElement('div'); d.textContent=s == null ? '' : String(s); return d.innerHTML }
function hostFor(p){ return p.base || '—'; }
function modelFor(providerId, customEl){
  const p=providerFor(providerId);
  if(providerId==='openrouter') return (customEl?.value || '').trim() || 'choose a model';
  return p.model || 'provider default';
}
function updateModelSummary(){
  const wp=providerFor(providerEl.value);
  const judgeId=judgeProviderEl.value || providerEl.value;
  const jp=providerFor(judgeId);
  const judgeCustom=judgeProviderEl.value ? orJudgeModelEl : orModelEl;
  writerModelLine.textContent=modelFor(providerEl.value,orModelEl);
  writerBaseLine.textContent=hostFor(wp);
  judgeModelLine.textContent=modelFor(judgeId,judgeCustom);
  judgeBaseLine.textContent=hostFor(jp);
}
// Return a human title; prefers the title-based slug after ingest completes.
function titleFor(j){
  const s = (j.slug || '');
  if (s && !/^https-|^youtu/.test(s)) return s.replace(/-/g,' ');
  const src=j.source||'';
  try { const u=new URL(src); const tail=u.pathname.split('/').filter(Boolean).pop(); return tail || u.hostname }
  catch (_) { return src.split('/').filter(Boolean).pop() || 'video' }
}
function ago(t){
  const sec=Math.max(0, Math.floor(Date.now()/1000-(Number(t)||0)));
  if(sec<60) return 'just now'; if(sec<3600) return `${Math.floor(sec/60)}m ago`;
  if(sec<86400) return `${Math.floor(sec/3600)}h ago`; return `${Math.floor(sec/86400)}d ago`;
}
function providerFor(id){ return providers.find(p=>p.id===id) || {}; }
function inFlightExcept(id){ return jobs.some(j=>j.id!==id && (j.status==='queued'||j.status==='running')) }

async function ensureOpenRouterModels(){
  if(orLoaded) return;
  const r=await fetch('/api/providers/openrouter/models');
  if(!r.ok) throw new Error(await r.text());
  const models=await r.json();
  document.getElementById('orModels').innerHTML=models.map(m=>
    `<option value="${esc(m.id)}">${esc(m.name)}  ctx ${Math.round((m.context_length||0)/1000)}k</option>`).join('');
  document.getElementById('orJudgeModels').innerHTML=models.map(m=>
    `<option value="${esc(m.id)}">${esc(m.name)}  ctx ${Math.round((m.context_length||0)/1000)}k</option>`).join('');
  orLoaded=true;
}
async function loadProviders(){
  const r=await fetch('/api/providers');
  if(!r.ok) throw new Error(await r.text());
  providers=(await r.json()).providers || [];
  const opts=providers.map(p=>`<option value="${esc(p.id)}">${esc(p.label)}</option>`).join('');
  providerEl.innerHTML=opts;
  judgeProviderEl.innerHTML='<option value="">Judge = same as writer</option>'+opts;
  providerEl.value='hyper';
  updateProviderUI();
}
async function updateProviderUI(){
  const isOr=providerEl.value==='openrouter';
  const judgeId=judgeProviderEl.value || providerEl.value;
  const jisOr=judgeId==='openrouter';
  modelWrap.classList.toggle('show',isOr);
  judgeModelWrap.classList.toggle('show',jisOr);
  updateModelSummary();
  pickerNote.textContent=(isOr || jisOr)
    ? 'Choose an OpenRouter model when that role is set to OpenRouter.'
    : 'Writer and Judge models use the selected provider defaults unless explicitly overridden.';
  if(isOr || jisOr){
    try {
      pickerNote.textContent='Loading OpenRouter models…';
      await ensureOpenRouterModels();
      pickerNote.textContent='Choose an OpenRouter model, or type a provider/model id.';
    } catch(e) {
      pickerNote.textContent='OpenRouter model list unavailable; type a provider/model id.';
    }
  }
  updateModelSummary();
}
providerEl.addEventListener('change',updateProviderUI);
judgeProviderEl.addEventListener('change',updateProviderUI);
orModelEl.addEventListener('input',updateModelSummary);
orJudgeModelEl.addEventListener('input',updateModelSummary);

async function loadHistory(autoTrack=true){
  const r=await fetch('/api/jobs'); if(!r.ok) return;
  jobs=await r.json();
  if(!jobs.length){ listEl.innerHTML='<div class="empty">Paste a video URL to start riffing.</div>'; return; }
  // when the user refreshes mid-render, re-attach to whatever's in flight
  if(autoTrack && !activeId){
    const inFlight=jobs.find(j=>j.status==='queued'||j.status==='running');
    if(inFlight){ track(inFlight.id); }
  }
  listEl.innerHTML=jobs.map(j=>{
    const terminal=j.status==='done'||j.status==='failed';
    return `<div class="row"><div class="row-head"><div style="min-width:0;flex:1">
      <div class="title" title="${esc(j.source)}">${esc(titleFor(j))}</div>
      <div class="src">${esc(j.source)}</div><div class="meta">${ago(j.created)}${j.provider&&j.model?' · writer '+esc(j.provider)+' ('+esc(j.model)+')':''}${(j.judge_provider||j.provider)&&(j.judge_model||j.model)?' · judge '+esc(j.judge_provider||j.provider)+' ('+esc(j.judge_model||j.model)+')':''}</div>
    </div><div class="row-actions"><span class="status st-${esc(j.status)}">${esc(j.status)}</span>
      <button class="btn2" onclick="track(${j.id})">View</button>
      <button class="btn2" onclick="hideJob(${j.id})">Hide</button>
      ${j.status==='queued'||j.status==='running'?`<button class="btn2" onclick="cancelJob(${j.id})">Cancel</button>`:''}
      ${terminal?`<button class="btn2 btn-danger" onclick="deleteJob(${j.id})">Delete</button>`:''}
    </div></div></div>`;
  }).join('');
  updateRerenderButton();
}

document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();
  const src=document.getElementById('src').value.trim(), provider=providerEl.value;
  const body={url:src,provider};
  if(provider==='openrouter' && orModelEl.value.trim()) body.model=orModelEl.value.trim();
  // optional judge override
  const jp=judgeProviderEl.value;
  if(jp){ body.judge_provider=jp; }
  if(jp==='openrouter' && orJudgeModelEl.value.trim()) body.judge_model=orJudgeModelEl.value.trim();
  const dens=parseInt(document.getElementById('riffDensity').value,10);
  if(!Number.isNaN(dens) && dens!==2) body.riff_density_bias=dens;  // skip when default
  const btn=document.getElementById('submitBtn'); btn.disabled=true;
  try {
    const r=await fetch('/api/jobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!r.ok) throw new Error(await r.text());
    const j=await r.json(); document.getElementById('src').value='';
    track(j.id); await loadHistory();
  } catch(err) { alert('Could not start job: '+err.message); }
  finally { btn.disabled=false; }
});

async function track(id){
  if(window._es) window._es.close();
  activeId=id; const token=++trackToken;
  // show the console immediately — don't wait for first SSE frame
  try { const r=await fetch(`/api/jobs/${id}`); const j=await r.json();
    jobs=jobs.filter(x=>x.id!==id).concat(j);
    renderActive(id, {status:j.status, log:[], stage:null}, token);
    activeEl.scrollIntoView({behavior:'smooth',block:'start'});
  } catch(_){}
  const es=new EventSource(`/api/jobs/${id}/events`); window._es=es;
  es.onmessage=m=>{
    const d=JSON.parse(m.data); if(d.error) return;
    const j=jobs.find(x=>x.id===id); if(j) j.status=d.status;
    renderActive(id,d,token);
    if(d.status==='done'||d.status==='failed'){ es.close(); loadHistory(); }
  };
  es.onerror=()=>{ if(es.readyState===EventSource.CLOSED) return; };
}

async function renderActive(id,d,token){
  if(token!==trackToken) return;
  let j=jobs.find(x=>x.id===id);
  if(!j){ const r=await fetch(`/api/jobs/${id}`); if(!r.ok)return; j=await r.json(); }
  let detail=null;
  if(d.status==='failed'){
    const r=await fetch(`/api/jobs/${id}`); detail=r.ok?await r.json():{};
    if(token!==trackToken)return;
  }
  let html=`<div class="card"><div class="detail-head"><div style="min-width:0"><div class="title">${esc(titleFor(j))}</div><div class="src">${esc(j.source)}</div></div>
    <span class="status st-${esc(d.status)}">${esc(d.status)}</span></div>`;
  if(d.status==='running' && d.progress){
    const p=d.progress;
    html+=`<div class="progress-wrap"><div class="pbar"><div class="pfill" style="width:${p.pct}%"></div></div>
      <div class="ptext">${p.done}/${p.total} stages complete${p.next_stage?' · next: '+esc(p.next_stage):''}</div></div>`;
  } else if(d.stage && d.status==='running') html+=`<div class="stage">▸ ${esc(d.stage)}</div>`;
  if(d.status==='running' || d.status==='queued' || d.status==='failed' || d.status==='canceled'){
    let lines=[...(d.log||[])];
    const failure=d.error || (detail&&detail.error) || '';
    const joined=lines.join('\n');
    if(failure && (!joined || (!joined.includes(failure) && !failure.includes(joined)))) lines.push('', 'ERROR:', failure);
    html+=lines.length
      ? `<pre class="log" id="logPane">${esc(lines.join('\n'))}</pre>`
      : `<pre class="log log-waiting" id="logPane">${d.status==='failed' ? 'Job failed; no log was captured.' : d.status==='canceled' ? 'Job canceled.' : 'Waiting for job to start…'}</pre>`;
  }
  if(d.status==='done'){
    let riffs=[]; try { riffs=await (await fetch(`/api/jobs/${id}/riffs`)).json(); } catch(_){ }
    if(token!==trackToken)return;
    const value=JSON.stringify(riffs,null,2); window._riffsOriginal=value; window._activeJobId=id;
    html+=`<p class="hint">Drag the handle to compare the original and riffed video.</p>
      <div class="compare" id="cmp"><video controls muted src="/api/jobs/${id}/video" id="orig"></video>
      <div class="after"><video controls src="/api/jobs/${id}/video" id="riff"></video></div><div class="handle" id="handle"></div></div>
      <p><button class="btn2" onclick="playVideo(${id})">▶ Play</button> <a class="dl" href="/api/jobs/${id}/video" download>download mp4</a><a class="dl" href="/api/jobs/${id}/srt" download>riffs.srt</a></p>
      <p class="hint">Re-edit the lines below (cheap re-render, keeps media):</p>
      <textarea id="riffsBox">${esc(value)}</textarea>
      <button class="btn2" id="rerenderBtn" onclick="rerender(${id})">🎬 Re-render with these riffs</button>`;
  }
  if(token!==trackToken)return;
  const prev=document.getElementById('logPane');
  const wasPinned = !prev || (prev.scrollHeight - prev.scrollTop - prev.clientHeight < 24);
  const previousTop = prev ? prev.scrollTop : 0;
  activeEl.innerHTML=html+'</div>'; updateRerenderButton();
  const box=document.getElementById('riffsBox'); if(box)box.addEventListener('input',updateRerenderButton);
  const pane=document.getElementById('logPane');
  if(pane){
    const keepUserPosition = logUserScrolling && !wasPinned;
    logProgrammatic=true;
    pane.scrollTop = keepUserPosition ? previousTop : pane.scrollHeight;
    requestAnimationFrame(()=>{ logProgrammatic=false; });
    pane.addEventListener('scroll',()=>{
      if(logProgrammatic) return;
      logUserScrolling=true;
      clearTimeout(logScrollTimer);
      logScrollTimer=setTimeout(()=>{
        const latest=document.getElementById('logPane');
        logUserScrolling=false;
        if(latest){
          logProgrammatic=true;
          latest.scrollTop=latest.scrollHeight;
          requestAnimationFrame(()=>{ logProgrammatic=false; });
        }
      },700);
    },{passive:true});
  }
}
function updateRerenderButton(){
  const b=document.getElementById('rerenderBtn'), box=document.getElementById('riffsBox'); if(!b||!box)return;
  b.disabled=box.value===window._riffsOriginal || inFlightExcept(window._activeJobId);
}
async function rerender(id){
  const box=document.getElementById('riffsBox'); if(!box)return;
  if(box.value===window._riffsOriginal || inFlightExcept(id))return;
  const r=await fetch(`/api/jobs/${id}/rerender`,{method:'POST',headers:{'Content-Type':'application/json'},body:box.value});
  if(!r.ok){ alert('Could not re-render: '+await r.text()); return; }
  await loadHistory(); track(id);
}
async function hideJob(id){
  const r=await fetch(`/api/jobs/${id}/hide`,{method:'POST'}); if(r.ok){ if(activeId===id){activeEl.innerHTML='';activeId=null;} await loadHistory(); }
}
async function cancelJob(id){
  const r=await fetch(`/api/jobs/${id}/cancel`,{method:'POST'});
  if(r.ok){ await loadHistory(); }
  else alert('Could not cancel: '+await r.text());
}
async function deleteJob(id){
  if(!confirm('Delete this completed job and its files?'))return;
  const r=await fetch(`/api/jobs/${id}/delete`,{method:'POST'});
  if(!r.ok){alert('Could not delete: '+await r.text());return;}
  if(activeId===id){activeEl.innerHTML='';activeId=null;} await loadHistory();
}
// Drag the handle while keeping both video elements in lockstep.
document.addEventListener('pointermove',e=>{
  const cmp=document.getElementById('cmp'); if(!cmp||!window._drag)return;
  const r=cmp.getBoundingClientRect(),x=Math.max(0,Math.min(r.width,e.clientX-r.left));
  document.getElementById('handle').style.left=x+'px'; cmp.querySelector('.after video').style.clipPath=`inset(0 0 0 ${(x/r.width)*100}%)`;
});
document.addEventListener('pointerdown',e=>{if(e.target.id==='handle'||e.target.id==='cmp')window._drag=true});
document.addEventListener('pointerup',()=>{window._drag=false});
setInterval(()=>{const o=document.getElementById('orig'),r=document.getElementById('riff');if(o&&r&&Math.abs(o.currentTime-r.currentTime)>.1){o.currentTime=r.currentTime;if(o.paused&&!r.paused)o.play();if(!o.paused&&r.paused)o.pause()}},120);
loadProviders().catch(e=>{pickerNote.textContent='Provider list unavailable.'});
loadHistory();
setInterval(loadHistory,5000);
</script>
